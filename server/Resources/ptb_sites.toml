# Plant the Bomb's bombsites (Gamemodes/Ptb.c), by map folder name: the five
# Counter-Strike bomb defusal maps of the mode's catalog, from the maps
# repository, whose tomls a download replaces, so the sites are kept here
# (built into the server too: a file here wins). A map's own toml [ptb]
# sites win over this table; a map in neither gets two places between its
# spawns.
#
# Each site: its name (A, B), the middle (x, y map columns), the floor block
# under it (z, map z: 0 the top) and its radius in blocks (a planter within it
# is on the site). Found with tools/find_bombsites.py (the painted marks of a
# map, else the flat walkable floors between the spawns nearer the
# defenders) and checked by eye on its top view: docs/ptb-sites.md.
# Team 1 (the arena's blue spawn) defends; team 2 (green) plants.

