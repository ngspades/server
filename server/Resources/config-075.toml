# The 0.75 server profile's config (docs/plan-075-server.md): read by
#   ngspades-server --profile 075      (make run-server-075)
# instead of config.toml. The same binary, speaking protocol 0.75/0.76 only:
# the classic game for unmodified 0.75 clients (BetterSpades, OpenSpades,
# ZeroSpades) and the browser, with every server-side part of ours (the bots,
# the planner, the plugins, the map rules) and none of the 1.0 inventions
# (perks, classes, assists, spotting, vehicles).
#
# It is a copy of config.toml with the profile's lines changed: its own port
# (so both servers run on one machine), the classic CTF rotation, the
# tolerant rules a 0.75 player expects, the public 0.75 masters, and the
# 1.0-only sections removed or off. Its data folder (bans, master.key,
# webrtc.pem, logs) is <root>/data-075/ unless --data or SP_DATA_DIR says
# otherwise.

[server]
# The server's name, shown on the server lists (ours and the public 0.75
# one). "{game}" (here and in the messages below) is the game's name.
name = "[NGS] Classic CTF 0.75"

# Port for the server to listen on: the 1.0 server's (32887) + 10, so the
# two never fight for it. The WebRTC port follows it ([webrtc] below).
port = 32897

# Players at most: 32, the 0.75 limit (a 0.75 client cannot see a player id
# of 32 or more). The server never takes more in this profile, whatever this
# says; a smaller number is kept.
max_players = 32

# 0 = ctf, classic: the 0.75 rules. 2 = babel. The 0.75 profile plays only
# these two (ngCTF, arena, zombie and creative are 1.0 modes).
gamemode = 0

# Max flag captures
capture_limit = 10

# Unused (the masters are [master] and [master075] below); kept as config.toml
master = false

# Map rotation: the classic CTF catalog (common/modes/modes.h)
maps = [
    "2Fort_CTF",
    "Raindance",
    "Busan_Port",
    "20thCenturyTown",
    "Arica_Harbor",
    "Urban_Assault",
    "Chinatown_296",
    "hiesville",
]

# Rotation modes:
#   "toml"       - Rotate through maps in the order defined above (default)
#   "alphabetic" - Rotate through maps alphabetically in order
#   "random"     - Randomly select a map on server start/restart
map_rotation_mode = "toml"

# Messages to send upon joining ("{game}" is the game's name)
welcome_messages = [
    "Welcome to {game}, classic CTF for Ace of Spades 0.75!",
    "Bots fill the teams: they dig, build and swim like players",
    "{game} is still in development, so expect some bugs"
]

# Messages to send periodically
periodic_messages = [
    "Capture the enemy intel and bring it back to your base to score",
    "Build cover with blocks: bots do it too"
]


# Team configuration
[teams]
# the light blue of the 1.0 profile: the classic 0, 0, 255 is hard to read
team1 = { name = "Blue Team", color = [62, 153, 234] }
team2 = { name = "Green Team", color = [0, 255, 0] }


# User passwords
# /login [role] [password]
[passwords]
manager   = "changeme1"
admin     = "changeme2"
moderator = "changeme3"
guard     = "changeme4"
trusted   = "changeme5"

# Maps the rotation names that are not in Resources/maps/ (nor in
# --maps-dir) are downloaded at start-up from the public maps repository,
# github.com/ngspades/maps (raw.githubusercontent.com, https only),
# checked, and kept in Resources/maps/ (or the data folder's maps/ when
# Resources/ cannot be written). /map <Name> of a map not installed
# downloads it in the background. false: only the maps already here play.
# SP_MAP_DOWNLOAD=0|1 wins.
[maps]
download = true


# No [jetpack], [perks], [classes], [sentry], [squads] or [zombie]: the
# perks, the classes, the squads and the zombie mode are 1.0 inventions and
# do not exist in the 0.75 profile (the server warns about such a section
# here, as a key its profile does not read).


# Lag compensation: server-side, the same for a 0.75 shooter. Also
# SP_LAGCOMP=0, SP_LAGCOMP_MAX_MS and SP_LAGCOMP_EXTRA_MS.
[net]
lag_compensation = true
lag_compensation_max_ms = 250
lag_compensation_extra_ms = 50
# One address may open this many connections in the window; 0 turns the
# guard off. Also SP_MAX_PER_IP.
max_connections_per_ip = 4
connection_window_seconds = 10


# Player conduct, with the tolerant values of [profile.075] below (a 0.75
# player comes from pyspades servers, which kicked later). Also SP_AFK_KICK,
# SP_AFK_WARN and SP_GRIEF_KICK.
[conduct]
afk_kick_seconds = 300
afk_warn_seconds = 240
afk_spectator_kick_seconds = 1800
grief_warn_points = 20
grief_kick_points = 40
grief_decay_seconds = 60
grief_team_damage_points = 1
grief_team_kill_points = 3
escape_watch = true
escape_watch_sky_seconds = 5
escape_watch_embedded_seconds = 3
escape_watch_entomb_seconds = 5


# Anti-cheat accounting: logged, never a kick for a packet outside the
# standard (old 0.75 clients send some). Also SP_ANTICHEAT=0.
[anticheat]
enabled = true
kick_on_protocol_violation = false
log_interval_seconds = 10


# Server-side bots. All keys are optional. Also SP_BOT_DIFFICULTY and
# SP_BOT_PROJECTS=0.
[bots]
difficulty = "normal"
cooperative_bridges = true

# Browsers join over WebRTC, speaking 0.75 (docs/plan-075-server.md 9): this
# profile's own UDP port, the game's + 1 by default (32898). Also
# SP_WEBRTC_PORT and SP_WEBRTC_STUN.
[webrtc]
# WebRTC is the browser transport: a match hosted from the game with
# "Friends join by code" turns it on by itself, and its friends (and
# browsers) join through the master's signalling. A dedicated server that
# wants browser players sets true (SP_WEBRTC_ENABLED); a server that leaves
# it off takes only native clients.
enabled = false
# port = 32898
stun = "stun:stun.l.google.com:19302"

# Our own server list: the browser's list and the WebRTC signalling go
# through it, so the 0.75 server is listed there too (with the profile's
# protocol, "0.75"). The key is this profile's own: no key_file here, so
# Net/Master.c makes it in the data folder (data-075/master.key); a
# key_file would be read relative to the root, which both profiles share.
# Tests set SP_MASTER=0 (which keeps the public 0.75 masters off too). Also
# SP_MASTER_URL (turns it on) and SP_MASTER_KEY.
[master]
enabled = true
url = "https://master.shootanddestroy.obex.pw"
country = ""

# The public 0.75 master (docs/plan-075-server.md 8.6), the one the vanilla
# clients' lists read (services.buildandshoot.com): the classic ENet
# announce, 32 players at most. A server in both lists is listed once, as
# ours. SP_MASTER=0 turns it off.
[master075]
enabled = true
address = "67.205.183.163:32886"

# The 0.75 protocol extensions the server offers (plan 7.4, the aosprotocol
# specification, github.com/zerospades/aosprotocol), each only to the
# clients that agree to it.
[ext075]
damage_markers = true
teamplay = true
player_properties = true
team_esp = true       # teammates through walls (the Config bit 1)
pings = true          # pings allowed (the Config bit 2)
compass = true        # the compass bar (the Config bit 4)
ping_lifetime = 12.0
# Flashlight (0x32): a player's light, switched on request (a plugin's
# on_flashlight may refuse it) and drawn by every client that agreed. The
# beam every player carries: reach in blocks, the cone's full angle in
# pi/256 (128 is 90 degrees), its colour, and how often it drops out
# (flicker / 512 of the time, 0 steady).
flashlight = true
flashlight_reach = 60
flashlight_cone = 128
flashlight_color = [255, 179, 128]
flashlight_flicker = 0
player_limit = true   # Player Limit (0xC0): announced; this profile still holds 32 players
message_types = true  # Message Types (0xC1): big, info, warning and error lines
kick_reason = true    # Kick Reason (0xC2): the reason in words before a kick
utf8_chat = true      # chat in UTF-8 (a 0xFF first byte) to the clients that read it
version_info = true   # the version handshake and the extended Version Get
# Daytime and Weather (0x33): the time of day. By night the clients that
# agreed draw the world black, lit only by the flashlights (turn those on
# above). night = true starts the server at night; /night on|off changes it.
daytime = true
night = false

# The rules a 0.75 client (BetterSpades, pyspades) expects from a public
# server (plan 10.1): the defaults of [conduct], [anticheat] and [gameplay]
# in this profile.
[profile.075]
anticheat_protocol_violation = false   # a packet outside the standard is logged, not a kick
grief_warn_points = 20
grief_kick_points = 40
afk_kick_seconds = 300
spawn_protection_seconds = 0

# The remote console (docs/rcon.md): off, as in config.toml. Its own port,
# so it never meets the 1.0 server's (32890).
[rcon]
enabled = false
bind = "127.0.0.1"
port = 32900
password = ""

# Plugins: Lua scripts from https://github.com/ngspades/plugins in
# Resources/plugins/. Only a plugin that says it supports the 0.75 profile
# loads here (docs/plan-075-server.md 5). Also SP_PLUGINS=a,b.
[plugins]
load = []
allow_map_change = false
allow_commands = []


# Spawn protection: none, as on a pyspades server ([profile.075]). Also
# SP_SPAWN_PROTECT (seconds).
[gameplay]
spawn_protection_seconds = 0


# Admin audit: logs/admin.log in this profile's data folder (no file key: a
# file here would be relative to the root both profiles share).
[audit]
enabled = true


# Mode presets (--preset <name>, SP_PRESET): the two modes of the profile.
[presets.ctf]
gamemode = 0
maps = ["2Fort_CTF", "Raindance", "Busan_Port"]
capture_limit = 10
bot_difficulty = "normal"
plugins = []

[presets.babel]
gamemode = 2
maps = ["Nine-Eye_Babel", "babelstairs"]
capture_limit = 10
bot_difficulty = "normal"
plugins = []
