# The dedicated server in Docker. From this folder (server/):
#
#   docker compose up -d                       the 1.0 server (this game's clients and browsers)
#   docker compose --profile classic up -d     plus the classic 0.75 server (OpenSpades, BetterSpades...)
#   docker compose logs -f                     what it says
#   docker attach sad-server                   its console (detach with Ctrl+P, Ctrl+Q)
#
# The first start writes Resources/config.toml (config-075.toml for the
# classic one) in the volume and downloads the maps it names. Change the name
# and the five admin passwords there before going public, then
# `docker compose restart`. Open the UDP ports below on the router.

x-server: &server
  build:
    context: ..
    dockerfile: server/Dockerfile
  image: ngspades-server
  restart: unless-stopped
  tty: true
  stdin_open: true
  # a ceiling, not a reservation: a match of 20 bots uses a few tens of MB
  # and a fraction of a core; 128 players with bots stay well under these
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 512M

services:
  server:
    <<: *server
    container_name: sad-server
    ports:
      - "32887:32887/udp" # the game
    volumes:
      - sad-data:/data

  classic:
    <<: *server
    profiles: ["classic"]
    container_name: sad-server-075
    environment:
      SP_PROFILE: "075"
    ports:
      - "32897:32897/udp" # the game, 0.75
    volumes:
      - sad-075-data:/data

volumes:
  sad-data:
  sad-075-data:
